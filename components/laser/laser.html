<div class="laser__content">
  <p data-i18n="laser.text">
    Pequeños detalles y piezas que grabamos y cortamos a láser: posavasos, llaveros, placas y regalos personalizados con un toque único.
  </p>
</div>

<div class="laser__grid">
  <figure class="laser__card">
    <span class="laser__img-spinner" aria-hidden="true"></span>
    <img
      src="/src/assets/images/laser/laser-01.jpg"
      data-i18n-attr="alt:laser.item1"
      alt="Posavasos personalizados grabados a láser"
      loading="lazy"
      decoding="async"
      onerror="this.onerror=null;this.src='/src/assets/images/projects/in-progress/in-progress-480.jpg';" />
    <figcaption data-i18n="laser.item1">Posavasos personalizados</figcaption>
  </figure>

  <figure class="laser__card">

      loading="lazy"
      decoding="async"
      onerror="this.onerror=null;this.src='/src/assets/images/projects/in-progress/in-progress-480.jpg';" />

  </figure>

  <figure class="laser__card">
    <span class="laser__img-spinner" aria-hidden="true"></span>
