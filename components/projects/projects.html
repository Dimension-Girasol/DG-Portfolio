<section class="projects section-space" id="projects">
  <div class="projects__container container">
    <div class="projects__content">
      <span class="section__tag" data-i18n="projects.tag">Nuestros proyectos</span>
      <h2 data-i18n="projects.title">Echa un vistazo a nuestra coleccion</h2>
    </div>

    <div class="projects__mode-toggle" id="laser" role="tablist" aria-label="Tipo de proyecto" data-i18n-attr="aria-label:projects.modeLabel">
      <span class="projects__mode-indicator" aria-hidden="true"></span>
      <button
        type="button"
        id="projects-tab-3d"
        class="projects__mode-btn is-active"
        data-mode="3d"
        role="tab"
        aria-selected="true"
        aria-controls="projects-panel-3d"
        tabindex="0"
        data-i18n="projects.mode3d">Impresión 3D</button>
      <button
        type="button"
        id="projects-tab-laser"
        class="projects__mode-btn"
        data-mode="laser"
        role="tab"
        aria-selected="false"
        aria-controls="laser-inline"
        tabindex="-1"
        data-i18n="projects.modeLaser">Láser</button>
    </div>

    <div class="projects__mode-panel" id="projects-panel-3d" data-mode-panel="3d" role="tabpanel" aria-labelledby="projects-tab-3d" tabindex="0">
      <p data-i18n="projects.text">Filtra por artista para descubrir distintas figuras hechas en impresion 3D y pintadas a mano.</p>

      <div class="projects__filters" role="group" aria-label="Filtrar proyectos" data-i18n-attr="aria-label:projects.filterLabel">
        <button
          class="projects__filter projects__filter-author"
          data-filter="jorge"
          aria-pressed="false"
          aria-label="Filtrar proyectos de Jorge"
          data-i18n-attr="aria-label:projects.filterJorge">
          <span class="projects__icon-wrap" aria-hidden="true">
            <img class="projects__icon projects__icon-default" src="/src/assets/images/projects/authors/jorge-icon.png" alt="" />
            <img class="projects__icon projects__icon-hover" src="/src/assets/images/projects/authors/jorge-icon_hover.png" alt="" />
          </span>
          <span class="projects__bubble" aria-hidden="true" data-i18n="projects.bubbleJorge">¡Soy Jorge! Mira mis proyectos</span>
        </button>

        <button
          class="projects__filter projects__filter-author is-active"
          type="button"
          data-filter="all"
          aria-pressed="true"
          aria-label="Mostrar todos los proyectos"
          data-i18n-attr="aria-label:projects.filterAll">
          <span class="projects__icon-wrap projects__icon-wrap-yuna" aria-hidden="true">
            <img class="projects__icon" src="/src/assets/images/icon-512x512.png" alt="" />
          </span>
          <span class="projects__bubble" aria-hidden="true" data-i18n="projects.bubbleAll">Ver todos</span>
        </button>

        <button
          class="projects__filter projects__filter-author"
          data-filter="esther"
          aria-pressed="false"
          aria-label="Filtrar proyectos de Esther"
          data-i18n-attr="aria-label:projects.filterEsther">
          <span class="projects__icon-wrap" aria-hidden="true">
            <img class="projects__icon projects__icon-default" src="/src/assets/images/projects/authors/esther-icon.png" alt="" />
            <img class="projects__icon projects__icon-hover" src="/src/assets/images/projects/authors/esther-icon_hover.png" alt="" />
          </span>
          <span class="projects__bubble" aria-hidden="true" data-i18n="projects.bubbleEsther">¡Soy Esther! Mira mis proyectos</span>
        </button>
      </div>

      <p class="projects__loading" role="status"></p>
      <div class="projects__gallery-wrapper">
        <button class="button button-primary projects__pagination-btn projects__pagination-btn--prev" id="projects-page-prev" style="display: none;" aria-label="Anterior" data-i18n-attr="aria-label:projects.pagePrev">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </button>
        <div id="card-gallery-projects" class="projects__gallery-content"></div>
        <button class="button button-primary projects__pagination-btn projects__pagination-btn--next" id="projects-page-next" style="display: none;" aria-label="Siguiente" data-i18n-attr="aria-label:projects.pageNext">
          <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        </button>
        <div class="projects__pagination" id="projects-pagination" style="display: none;">
          <span class="projects__pagination-info" id="projects-page-info"></span>
        </div>
      </div>
    </div>

    <div class="projects__mode-panel" id="laser-inline" data-mode-panel="laser" role="tabpanel" aria-labelledby="projects-tab-laser" tabindex="0" hidden></div>

    <div id="modal-detail-project"></div>
  </div>
</section>
