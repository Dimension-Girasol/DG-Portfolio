<section class="merch section-space" id="merch" aria-labelledby="merch-title">
  <div class="merch__container container">
    <div class="merch__content">
      <span class="section__tag" data-i18n="merch.tag">Nuestro Merchandising</span>
      <h2 id="merch-title" data-i18n="merch.title">Detallitos que regalamos</h2>
      <p data-i18n="merch.text">
        Pines de madera grabados y cortados a láser, girasoles NFC y alguna sorpresa más. No están a la venta: los repartimos en ferias, colaboraciones y como regalo para quien nos conoce.
      </p>
    </div>

    <ul class="merch__pins">
      <li class="merch__pin">
        <button type="button" class="merch__pin-trigger" aria-pressed="false">
          <span class="merch__pin-badge">
            <span class="merch__pin-spinner" aria-hidden="true"></span>
            <img
              src="/src/assets/images/merch/merch-01.jpg"
              data-i18n-attr="alt:merch.item1"
              alt="Llavero girasol con NFC"
              loading="lazy"
              decoding="async"
              onerror="this.onerror=null;this.src='/src/assets/images/projects/in-progress/in-progress-480.jpg';" />
          </span>
          <span class="merch__pin-label" data-i18n="merch.item1">Llavero girasol NFC</span>
        </button>
      </li>

      <li class="merch__pin">
        <button type="button" class="merch__pin-trigger" aria-pressed="false">
          <span class="merch__pin-badge">
            <span class="merch__pin-spinner" aria-hidden="true"></span>
            <img
              src="/src/assets/images/merch/merch-02.jpg"
              data-i18n-attr="alt:merch.item2"
              alt="Pin de madera con nuestro logo, grabado y cortado a láser"
              loading="lazy"
              decoding="async"
              onerror="this.onerror=null;this.src='/src/assets/images/projects/in-progress/in-progress-480.jpg';" />
          </span>
          <span class="merch__pin-label" data-i18n="merch.item2">Pin de madera grabado</span>
        </button>
      </li>

      <li class="merch__pin">
        <button type="button" class="merch__pin-trigger" aria-pressed="false">
          <span class="merch__pin-badge">
            <span class="merch__pin-spinner" aria-hidden="true"></span>
            <img
              src="/src/assets/images/merch/merch-03.jpg"
              data-i18n-attr="alt:merch.item3"
              alt="Pegatinas"
              loading="lazy"
              decoding="async"
              onerror="this.onerror=null;this.src='/src/assets/images/projects/in-progress/in-progress-480.jpg';" />
          </span>
          <span class="merch__pin-label" data-i18n="merch.item3">Pegatinas</span>
        </button>
      </li>
    </ul>

    <div class="merch__cta">
      <a href="https://www.instagram.com/dimensiongirasol/" target="_blank" rel="noopener noreferrer" class="button button-primary">
        <i class="fab fa-instagram" aria-hidden="true"></i>
        <span data-i18n="merch.cta">Síguenos para conseguir el tuyo</span>
      </a>
    </div>
  </div>
</section>
