<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon -->
    <link rel="icon" href="/src/assets/images/favicon.png" type="image/x-icon">
    <title>Dimensión Girasol</title>
    <!-- CSS -->
    <link rel="stylesheet" href="/style/styles.css"/>
    <link rel="stylesheet" href="/style/header.css"/>
  </head>
  <body>
    <header class="header">
        <section class="header__info">
            <p>¡Descubre el arte digital llevado a la realidad! Impresión 3D en resina y filamento. Grabado y corte láser.</p>
        </section>
        <section class="container-navbar">
            <nav class="navbar container">
                <a href="index.html" class="navbar__logo">
                    <img src="/src/assets/images/dg-logo_navbar.png" alt="logo Dimension Girasol">
                </a>
                <div class="navbar__nav">
                    <ul class="nav__list">
                        <li class="nav__link">
                            <a href="index.html">Inicio</a>
                        </li>
                        <li class="nav__link">
                            <a href="index.html">Proyectos</a>
                        </li>
                        <li class="nav__link">
                            <a href="index.html">Conócenos</a>
                        </li>
                    </ul>
                   <!-- <form action="" class="navbar__search">
                        <a href="#">
                            <img src="#" alt="botón de búsqueda">
                        </a>
                    </form> -->
                    <a href="#" class="button button-primary button-contacto">Contacto</a>
                    <button class="navbar__toggle-btn">
                        <img src="/src/assets/images/menu-icon.png" alt="Botón menú de navegación">
                    </button>
                    <div class="navbar__mobile-menu">
                    <ul class="nav__list-mobile">
                        <li class="nav__link-mobile">
                            <a href="index.html">Inicio</a>
                        </li>
                        <li class="nav__link-mobile">
                            <a href="index.html">Proyectos</a>
                        </li>
                        <li class="nav__link-mobile">
                            <a href="index.html">Conócenos</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </section>
    </header>
    <script src="js/app.js"></script>
  </body>
</html>
