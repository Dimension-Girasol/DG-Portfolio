<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon-48x48.png" sizes="48x48" type="image/png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/src/assets/images/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>Dimension Girasol</title>
    <meta
      name="description"
      content="Dimension Girasol crea figuras, miniaturas y piezas personalizadas con impresion 3D, pintura a mano y grabado laser." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://dg-backend-qy0a.onrender.com">
    <link rel="preconnect" href="https://imagenes.dimensiongirasol.com">
    <link rel="preload" href="/src/assets/fonts/arquitecta/Arquitecta.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="/src/assets/fonts/arquitecta/ArquitectaMedium.otf" as="font" type="font/otf" crossorigin>
    <link rel="preload" href="/src/assets/fonts/bageo/Bageo.otf" as="font" type="font/otf" crossorigin>
    <script>
      (() => {
        const key = "dg-theme";
        const saved = localStorage.getItem(key);
        const theme = saved === "light" || saved === "dark" ? saved : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/style/main.css" />
  </head>
  <body data-page="home">
    <div id="header"></div>
    <div id="hero"></div>
    <div id="projects"></div>
    <div id="about-root"></div>
    <div id="footer"></div>
    <script src="/js/config/i18n.js" defer></script>
    <script src="/js/components/loadComponents.js" defer></script>
  </body>
</html>
